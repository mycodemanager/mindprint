# ── 状态定义 (STATUS DEFINITIONS) ───────────────────────────────────
# Epic 状态:
#   - backlog:      Epic 尚未启动
#   - in-progress:  Epic 进行中（正在创建 / 实现其下的 story）
#   - done:         Epic 下所有 story 已完成
#
# Epic 状态流转:
#   - backlog → in-progress: 创建该 epic 第一个 story 时自动触发 (via create-story)
#   - in-progress → done:    该 epic 所有 story 到达 'done' 后手动标记
#
# Story 状态:
#   - backlog:        Story 仅存在于 epic 文件中（尚未生成 story 文件）
#   - ready-for-dev:  Story 文件已在 implementation-artifacts 下创建
#   - in-progress:    开发者正在实现
#   - review:         待代码评审 (via dev 的 code-review workflow)
#   - done:           Story 已完成
#
# Retrospective 状态:
#   - optional:  可进行但非必须
#   - done:      复盘已完成
#
# ── 工作流说明 (WORKFLOW NOTES) ─────────────────────────────────────
# - 创建某 epic 第一个 story 时，该 epic 自动转为 'in-progress'
# - 团队产能允许时多个 story 可并行推进
# - 通常在上一个 story 'done' 后再创建下一个，以吸收其实现经验
# - dev 将 story 移到 'review'，再跑 code-review（建议全新上下文 / 不同 LLM）
# - 重跑 sprint-planning 会刷新自动检测的状态（已推进的状态不会被回退）
# ════════════════════════════════════════════════════════════════════

